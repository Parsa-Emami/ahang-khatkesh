[program:ahang-khatkesh-worker]
process_name=%(program_name)s
command=/usr/bin/php8.5 /srv/ahang-khatkesh/current/artisan queue:work database --sleep=1 --tries=3 --timeout=120 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/srv/ahang-khatkesh/current/storage/logs/worker.log

[program:ahang-khatkesh-media]
process_name=%(program_name)s
command=/usr/bin/php8.5 /srv/ahang-khatkesh/current/artisan queue:work media_database --queue=media --sleep=1 --tries=1 --timeout=800 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=840
redirect_stderr=true
stdout_logfile=/srv/ahang-khatkesh/current/storage/logs/media-worker.log
