limit_req_zone $binary_remote_addr zone=music_upload_rate:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=music_upload_connections:10m;

server {
    listen 80;
    server_name music.example.com;
    root /srv/ahang-khatkesh/current/public;
    index index.php;
    client_max_body_size 544m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_buffering off;
    }
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ ^/api/v1/admin/(media|playlists/[0-9]+/cover)$ {
        limit_req zone=music_upload_rate burst=5 nodelay;
        limit_conn music_upload_connections 2;
        client_body_timeout 30s;
        try_files $uri /index.php?$query_string;
    }
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
