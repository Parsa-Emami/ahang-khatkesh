name: Verify ahang-khatkesh
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ahang_test
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
          MYSQL_USER: ci
          MYSQL_PASSWORD: ephemeral-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pephemeral-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'ahang_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: ci
      DB_PASSWORD: ephemeral-ci-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, fileinfo, pdo_sqlite, pdo_mysql, pcntl, posix
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Verify architecture structure
        run: |
          node --test scripts/roadmap.test.mjs
          node scripts/check-architecture.mjs
          node scripts/check-roadmap.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install media probe
        timeout-minutes: 5
        run: |
          if ! command -v ffprobe || ! command -v ffmpeg; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
          fi
      - name: Verify media process tools
        run: |
          command -v setsid
          command -v prlimit
          ffmpeg -version | head -1
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: composer audit
      - run: npm ci
      - name: Offline npm advisory scan
        run: bash scripts/audit-npm.sh
      - run: php vendor/bin/pint --test
      - run: npm run format:check
      - run: npm run build
      - run: mkdir -p reports
      - run: npm test -- --reporter=default --reporter=json --outputFile=reports/vitest.json
      - run: php vendor/bin/phpunit --log-junit=reports/phpunit.xml
      - name: MySQL process isolation and recovery
        if: matrix.database == 'mysql'
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pephemeral-ci-only -e "CREATE DATABASE ahang_f07_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL ON ahang_f07_test.* TO 'ci'@'%';"
          php vendor/bin/phpunit -c phpunit-concurrency.xml --log-junit=reports/concurrency.xml
        env:
          DB_DATABASE: ahang_f07_test
          AHANG_CONCURRENCY: '1'
      - name: Browser journeys with real CSRF
        if: matrix.database == 'sqlite'
        run: npm run test:browser
        env:
          AHANG_BROWSER_CHANNEL: chrome
          AHANG_BROWSER_WEBGL: '1'
      - name: Record tested source and suites
        run: node scripts/collect-verification.mjs
        env:
          AHANG_DATABASE: ${{ matrix.database }}
      - name: Retain synthetic F10 visual matrix
        if: always() && matrix.database == 'sqlite'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f10-visual-matrix
          path: reports/f10-visual/
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic F11 privacy screens
        if: always() && matrix.database == 'sqlite'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f11-privacy
          path: reports/f11-privacy/
          if-no-files-found: error
          retention-days: 14
