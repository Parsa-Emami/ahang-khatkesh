name: P01-C commit verified Composer lock
"on":
  push:
    branches: ['security/p01-c-composer-remediation']
    paths: ['.github/workflows/p01-c-commit-lock.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: p01-c-commit-lock
  cancel-in-progress: false
jobs:
  publish-lock:
    if: github.repository == 'Parsa-Emami/ahang-khatkesh' && github.ref == 'refs/heads/security/p01-c-composer-remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact successful resolver artifact and stage only the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source=0a3e5a916d6a047510cc5c5077d8e74f32402cfb
          run_id=45772341293
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha + " " + .conclusion' | grep -Fx "$source success"
          git merge-base --is-ancestor "$source" HEAD
          git diff --exit-code "$source" HEAD -- composer.json composer.lock
          out="$RUNNER_TEMP/resolved-lock"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name p01-c-resolved-composer-lock --dir "$out"
          test "$(cat "$out/source-commit.txt")" = "$source"
          test "$(sha256sum "$out/composer.lock" | cut -d ' ' -f 1)" = "$(cat "$out/composer-lock.sha256")"
          python3 -m json.tool "$out/composer.lock" > /dev/null
          cp "$out/composer.lock" composer.lock
          git add -- composer.lock
          test "$(git diff --cached --name-only)" = composer.lock
      - name: Commit verified resolver output to isolated branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(deps): apply audited Composer resolver output (P01-C)'
          gh auth setup-git
          git push origin HEAD:refs/heads/security/p01-c-composer-remediation
