name: Prepare isolated PHP validation
on:
  push:
    branches: [codex/f12-catalog-admin]
    paths: [.github/workflows/f12-runtime.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, fileinfo, pdo_sqlite, pdo_mysql, pcntl, posix
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: Package public runtime and installed test dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, shutil, re, json
          root = Path('runtime')
          (root/'lib').mkdir(parents=True)
          (root/'extensions').mkdir()
          binary = Path(subprocess.check_output(['which', 'php'], text=True).strip()).resolve()
          shutil.copy2(binary, root/'php')
          extension_dir = Path(subprocess.check_output(['php', '-r', 'echo ini_get("extension_dir");'], text=True))
          modules = ['mysqlnd','pdo','pdo_sqlite','sqlite3','mbstring','dom','xml','xmlwriter','xmlreader','simplexml','tokenizer','ctype','fileinfo','curl','intl','posix','pcntl','zip','iconv','phar','bcmath','session','pdo_mysql']
          copied = []
          for module in modules:
              path = extension_dir/(module+'.so')
              if path.exists():
                  shutil.copy2(path, root/'extensions'/path.name)
                  copied.append(module)
          queue = [binary, *[root/'extensions'/(name+'.so') for name in copied]]
          visited = set()
          while queue:
              path = queue.pop()
              output = subprocess.run(['ldd', str(path)], capture_output=True, text=True).stdout
              for value in re.findall(r'(?:=>\s+)?(/[^\s]+)', output):
                  source = Path(value)
                  if source.name in visited or re.match(r'(ld-linux|lib(c|m|pthread|resolv|dl|rt|util)\.so|libnss_)', source.name):
                      continue
                  visited.add(source.name)
                  shutil.copy2(source, root/'lib'/source.name)
                  queue.append(source)
          (root/'php.ini').write_text('memory_limit=512M\ndate.timezone=UTC\nzend.assertions=1\n'+''.join('extension='+name+'.so\n' for name in copied))
          (root/'provenance.json').write_text(json.dumps({'php':subprocess.check_output(['php','-r','echo PHP_VERSION;'],text=True),'platform':'ubuntu-24.04','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}))
          PY
          tar -czf php85-validation.tar.gz runtime vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: php85-validation
          path: php85-validation.tar.gz
          retention-days: 3
